- job:
    name: ps-package-testing-molecule-chaos-iops
    project-type: pipeline
    description: |
        Do not edit this job through the web!
        Sequential QEMU install-testing on the "lenovo" node with the guest
        disk IOPS swept across a range (default 100 -> 1000). One VM at a time.
    properties:
        - build-discarder:
            num-to-keep: 100
    concurrent: false
    pipeline-scm:
        scm:
            - git:
                url: https://github.com/Percona-Lab/jenkins-pipelines.git
                # Fetch ONLY this branch (the repo has hundreds) and keep the
                # clone shallow + incremental so the agent is not swamped by a
                # full recursive workspace wipe + full re-clone on every build,
                # which was stalling the node past the remoting ping timeout.
                refspec: '+refs/heads/local-jenkins-chaos:refs/remotes/origin/local-jenkins-chaos'
                honor-refspec: true
                branches:
                    - 'local-jenkins-chaos'
                shallow-clone: true
                depth: 1
                wipe-workspace: false
                timeout: 20
        lightweight-checkout: true
        script-path: ps/jenkins/ps-package-testing-molecule-chaos-iops.groovy
