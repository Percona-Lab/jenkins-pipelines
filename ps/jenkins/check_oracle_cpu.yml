- job:
    name: check-oracle-cpu
    project-type: pipeline
    description: |
        Do not edit this job through the web!
        Monitor Oracle CPU/CSPU pages for CVE set changes
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines.git
            branches:
            - master
            wipe-workspace: false
      lightweight-checkout: false
      script-path: ps/jenkins/check_oracle_cpu.groovy
    triggers:
      - timed: "H */4 * * *"
