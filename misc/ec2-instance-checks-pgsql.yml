- job:
    name: ec2-instance-checks-pgsql
    project-type: pipeline
    description: |
        Scheduled reaper: scans all AWS regions for leaked PGSQL molecule QA EC2 instances,
        terminating those older than 6 h and stopping key-owned instances older than 12 h.
        Runs every 6 h. Managed by JJB from misc/ec2-instance-checks-pgsql.groovy —
        do not edit this job through the web!
    concurrent: false
    properties:
        - build-discarder:
            artifact-days-to-keep: -1
            artifact-num-to-keep: 160
            days-to-keep: -1
            num-to-keep: 160
    pipeline-scm:
        scm:
            - git:
                url: https://github.com/Percona-Lab/jenkins-pipelines.git
                branches:
                    - 'ec2-instanct-checks-pg-mysql-sep'
                wipe-workspace: true
        lightweight-checkout: true
        script-path: misc/ec2-instance-checks-pgsql.groovy
    triggers:
      - timed: "0 */6 * * *"
