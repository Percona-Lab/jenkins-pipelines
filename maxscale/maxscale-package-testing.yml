- job:
    name: hetzner-percona-maxscale-package-testing
    project-type: pipeline
    description: |
        Do not edit this job through the web!

        Verifies published percona-maxscale packages: installs them from a repo.percona.com
        component with percona-release, on every supported platform, and checks that MaxScale
        routes queries through two real MariaDB servers.
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines.git
            branches:
            - 'hetzner'
            wipe-workspace: false
      lightweight-checkout: true
      script-path: maxscale/maxscale-package-testing.groovy
