- job:
    name: hetzner-percona-maxscale-RELEASE
    project-type: pipeline
    description: |
        Do not edit this job through the web!

        VALIDATION PHASE: this job reads its pipeline from the feat/maxscale-2308
        branch, not from hetzner, because the build has never been run. Change the
        branch below to hetzner once a build has passed, and merge the pipeline
        there in the same step.
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines.git
            branches:
            - 'feat/maxscale-2308'
            wipe-workspace: false
      lightweight-checkout: true
      script-path: maxscale/maxscale.groovy
