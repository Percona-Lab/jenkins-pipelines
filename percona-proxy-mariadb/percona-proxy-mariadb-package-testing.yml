- job:
    name: hetzner-percona-proxy-mariadb-package-testing
    project-type: pipeline
    description: |
        Do not edit this job through the web!

        Installs percona-proxy-mariadb from a repo.percona.com component on every supported
        platform and checks that Percona Proxy routes queries through two real MariaDB servers,
        that a MariaDB MaxScale configuration can be migrated, and that runtime administration
        is persisted. This job tests what is already published; the build job verifies the
        packages it produces before they are pushed.
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines.git
            branches:
            - 'hetzner'
            wipe-workspace: false
      lightweight-checkout: true
      script-path: percona-proxy-mariadb/percona-proxy-mariadb-package-testing.groovy
