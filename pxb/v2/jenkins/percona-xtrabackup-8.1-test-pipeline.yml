- job:
    name: percona-xtrabackup-8.1-test-pipeline
    project-type: pipeline
    description: |
        Do not edit this job through the web!
    concurrent: true
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines
            branches:
            - "master"
            wipe-workspace: false
      lightweight-checkout: true
      script-path: pxb/v2/jenkins/percona-xtrabackup-8.1-test-pipeline.groovy
    parameters:
    - choice:
        name: DOCKER_OS
        choices:
          - centos:8
          - oraclelinux:9
          - ubuntu:focal
          - ubuntu:jammy
          - ubuntu:noble
          - debian:bullseye
          - debian:bookworm
          - asan
        description: OS version for compilation
    - choice:
        name: CMAKE_BUILD_TYPE
        choices:
          - RelWithDebInfo
          - Debug
        description: Type of build to produce
    - choice:
        name: XTRABACKUP_TARGET
        choices:
        - innodb80
        - xtradb80
        description: Type of build to produce
    - string:
        name: BOOTSTRAP_URL
        default:
        description:
    - string:
        name: SERVER_TARBALL_URL
        default: ""
        description: "URL of a Percona Server tarball with one top directory, for example the binary.tar.gz of a percona-server pipeline-parallel-mtr build. The xtradb target uses it in place of the bootstrap.sh download, the innodb target keeps bootstrap.sh. DOCKER_OS must match the OS of that build"
    - text:
        name: SERVER_TARBALL_URLS
        default: ""
        description: "Percona Server tarballs for the xtradb target, one line per OS and build type as DOCKER_OS CMAKE_BUILD_TYPE URL, for example ubuntu:noble Debug https://.../binary.tar.gz. Each URL is the binary.tar.gz of a percona-server pipeline-parallel-mtr build of that OS and build type. The asan runs use the oraclelinux:9 lines. An xtradb run with no line for its OS and build type fails. The innodb target keeps bootstrap.sh. A set SERVER_TARBALL_URL wins over this list"
    - string:
        name: USE_BINARIES_FROM_BUILD_ID
        default: "lastSuccessfulBuild"
        description: Specific percona-xtrabackup-8.1-compile-param build id to use binaries from.
    - string:
        name: INNODB80_VERSION
        default: "8.4.11"
        description: Version of MySQL InnoDB80 which will be used for bootstrap.sh script
    - string:
        name: XTRADB80_VERSION
        default: "8.4.11-11"
        description: Version of Percona XtraDB80 which will be used for bootstrap.sh script
    - string:
        name: XBTR_ARGS
        default:
        description: "./run.sh options, for options like: -j N Run tests in N parallel processes, -T seconds, -x options Extra options to pass to xtrabackup"
    - bool:
        name: WITH_AZURITE
        default: false
        description: "Starts Microsoft Azurite emulator and tests xbcloud against it"
    - bool:
        name: WITH_XBCLOUD_TESTS
        default: true
        description: "Run xbcloud tests"
    - bool:
        name: WITH_VAULT_TESTS
        default: true
        description: "Run vault tests"
    - bool:
        name: WITH_KMIP_TESTS
        default: true
        description: "Run kmip tests"
    - bool:
        name: WITH_KEYCLOAK_TESTS
        default: true
        description: "Run OIDC tests against a Keycloak container (xtradb targets only)"
    - choice:
        name: CLOUD
        choices:
        - "Hetzner"
        - "AWS"
        description: "Host provider for Jenkins workers"
