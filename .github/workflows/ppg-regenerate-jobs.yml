# Regenerate the ppg molecule jobs owned by Percona-QA/ppg-testing
# (ppg/*.groovy + ppg/*.yml with the GENERATED header, rendered by its
# tools/gen_jenkins.py from */scenario.yml + templates/jenkins/) and publish
# the result as a PR on one rolling branch -- same mechanics as the weekly AMI
# refresh in ppg-ami-factory.yml.
#
# Triggers: repository_dispatch sent by ppg-testing's qa-tools workflow on
# every push to its main (event ppg-testing-updated, needs a token with
# access to this repo configured there), a daily schedule as the fallback when
# that dispatch is not set up, manual.
# Actions are pinned to commit SHAs; the trailing "# vX.Y.Z" records the tag.

name: ppg-regenerate-jobs
run-name: regenerate ppg jobs from ppg-testing (${{ github.event_name }})

on:
  repository_dispatch:
    types: [ppg-testing-updated]
  workflow_dispatch:
    inputs:
      ppg_testing_ref:
        description: 'ppg-testing branch, tag or sha to generate from'
        required: false
        default: 'main'
  schedule:
    - cron: '30 6 * * *' # daily 06:30 UTC

permissions:
  contents: read

concurrency:
  group: ppg-regenerate-jobs
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate ppg jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: master

      - name: checkout ppg-testing
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Percona-QA/ppg-testing
          ref: ${{ github.event.client_payload.sha || inputs.ppg_testing_ref || 'main' }}
          path: .ppg-testing

      - name: Regenerate from ppg-testing
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'jinja2==3.1.6' 'pyyaml==6.0.3'
          echo "PPG_TESTING_SHA=$(git -C .ppg-testing rev-parse --short HEAD)" >> "$GITHUB_ENV"
          PPG_TESTING_DIR="$PWD/.ppg-testing" ppg/check-generated.sh --write
          rm -rf .ppg-testing

      - name: Commit and open a PR if changed
        # master rejects direct pushes (protected branch), so the result is
        # published as a PR on one fixed rolling branch. Force-push keeps that
        # branch current; an already-open PR is reused. Needs pull-requests:
        # write plus the repo setting "Allow GitHub Actions to create and
        # approve pull requests".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A ppg/
          if git diff --cached --quiet; then
            echo "generated ppg jobs already match ppg-testing ${PPG_TESTING_SHA}; nothing to commit"
            exit 0
          fi
          git diff --cached --stat
          branch=ppg-jobs-regen
          git config user.name "ppg-regenerate-jobs-bot"
          git config user.email "actions@github.com"
          git checkout -B "$branch"
          git commit -m "Regenerate ppg jobs from ppg-testing ${PPG_TESTING_SHA}"
          # The rolling branch is bot-owned and rebuilt from master on every run;
          # manual commits on it do not survive the next regeneration.
          git push --force origin "HEAD:$branch"
          # Count only same-repo PRs: an unqualified --head also matches a fork
          # PR whose head branch happens to share the name.
          open_prs=$(gh pr list --head "$branch" --base master --state open \
            --json number,headRepositoryOwner \
            --jq '[.[] | select(.headRepositoryOwner.login == "'"${GITHUB_REPOSITORY_OWNER}"'")] | length')
          if [ "$open_prs" = "0" ]; then
            gh pr create --head "$branch" --base master \
              --title "Regenerate ppg jobs from ppg-testing" \
              --body "ppg/*.groovy and ppg/*.yml regenerated by ppg-testing tools/gen_jenkins.py at ppg-testing ${PPG_TESTING_SHA}. Opened automatically by the ppg-regenerate-jobs workflow."
          else
            echo "open PR for $branch already exists; branch force-updated"
          fi
