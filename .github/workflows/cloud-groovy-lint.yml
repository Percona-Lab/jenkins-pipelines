# Static lint for cloud Jenkins pipeline code.
# This validates Groovy syntax and CodeNarc rules;
# Actions and npm-groovy-lint are pinned to exact versions.

name: cloud-groovy-lint

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'cloud/common/**/*.groovy'
      - 'cloud/jenkins/pgo_rancher.groovy'
      - 'cloud/jenkins/psmdbo_*.groovy'
      - 'cloud/jenkins/pso_*.groovy'
      - 'cloud/jenkins/pxco_*.groovy'
      - '.groovylintrc.json'
      - '.github/workflows/cloud-groovy-lint.yml'
  pull_request:
    paths:
      - 'cloud/common/**/*.groovy'
      - 'cloud/jenkins/pgo_rancher.groovy'
      - 'cloud/jenkins/psmdbo_*.groovy'
      - 'cloud/jenkins/pso_*.groovy'
      - 'cloud/jenkins/pxco_*.groovy'
      - '.groovylintrc.json'
      - '.github/workflows/cloud-groovy-lint.yml'

permissions:
  contents: read

concurrency:
  group: cloud-groovy-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint cloud Groovy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Lint
        run: |
          npx --yes npm-groovy-lint@18.0.0 --failon error \
            cloud/common \
            cloud/jenkins/pgo_rancher.groovy \
            cloud/jenkins/psmdbo_*.groovy \
            cloud/jenkins/pso_*.groovy \
            cloud/jenkins/pxco_*.groovy
