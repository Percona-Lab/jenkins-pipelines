- job:
    name: hetzner-valkey-RELEASE-from-repository
    project-type: pipeline
    description: |
        hetzner-RELEASE-from-repository for several builds in one run (one PATH_TO_BUILD
        per line in PATHS). Pushes each build exactly as the shared job does, then syncs
        the repo to production and refreshes the downloads area once.
        Do not edit this job through the web!
        Check repo.percona.com/index.html and update it if needed 
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines.git
            branches:
            - 'hetzner'
            wipe-workspace: false
      lightweight-checkout: true
      script-path: rel/jenkins/valkey-release-from-repository.groovy
