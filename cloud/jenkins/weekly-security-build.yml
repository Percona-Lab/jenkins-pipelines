- job-template:
    name: 'weekly-security-build-{repository_id}'
    project-type: pipeline
    concurrent: false
    description: |
        Do not edit this job through the web!
    # Enable when the scheduled security builds are ready to run.
    # triggers:
    #   - parameterized-timer:
    #       cron: '{schedule} % OPERATOR={repository}'
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines.git
            branches: ["master"]
            wipe-workspace: false
      lightweight-checkout: true
      script-path: cloud/jenkins/weekly_security_build.groovy

- project:
    name: weekly-security-builds
    jobs:
      - 'weekly-security-build-{repository_id}':
          repository_id: pso
          repository: percona-server-mysql-operator
          # schedule: '0 8 * * 0'
