- job:
    name: pg-community-containers-docker-build
    project-type: pipeline
    description: |
        Build and push community (PGDG-based) PostgreSQL docker images from percona-docker postgresql-containers/community.
        Do not edit this job through the web!
    concurrent: false
    properties:
    - build-discarder:
        days-to-keep: -1
        num-to-keep: 10
        artifact-days-to-keep: -1
        artifact-num-to-keep: 10
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines.git
            branches:
            - master
            wipe-workspace: false
      lightweight-checkout: true
      script-path: cloud/jenkins/pg_community_containers_docker_build.groovy
    parameters:
    - string:
        name: GIT_PD_BRANCH
        default: main
        description: Tag/Branch for percona/percona-docker repository
    - string:
        name: GIT_PD_REPO
        default: https://github.com/percona/percona-docker
        description: percona/percona-docker repository
    - choice:
        name: BASE_OS
        choices:
        - el9
        - ubi8
        description: Base image family. el9 publishes <branch>-*-community tags, ubi8 publishes <branch>-ubi8-*-community tags.
    - bool:
        name: BUILD_POSTGRES
        default: true
        description: Build postgres 14-18 community images
    - bool:
        name: BUILD_POSTGRES19_BETA
        default: false
        description: Build postgres 19 (BETA, PGDG testing repo) community image
    - bool:
        name: BUILD_PGBACKREST
        default: true
        description: Build pgbackrest community image
    - bool:
        name: BUILD_PGBOUNCER
        default: true
        description: Build pgbouncer community image
    - bool:
        name: BUILD_UPGRADE
        default: true
        description: Build upgrade community image
