- job:
    name: psmdbo-par
    project-type: pipeline
    description: |
        CLOUD-1004 pilot: several PSMDB e2e tests at the same time on each GKE cluster.
        Temporary job, delete after the pilot. Short name: GKE cluster names must be under 40 characters. Do not edit this job through the web!
    concurrent: false
    properties:
    - build-discarder:
        days-to-keep: -1
        num-to-keep: 10
        artifact-days-to-keep: -1
        artifact-num-to-keep: 10
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines.git
            branches:
            - CLOUD-1004-parallel-pilot
            wipe-workspace: false
      lightweight-checkout: true
      script-path: cloud/jenkins/psmdbo_gke_parallel_pilot.groovy
