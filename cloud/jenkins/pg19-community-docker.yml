- job:
    name: pg19-community-docker-build
    project-type: pipeline
    description: |
        Build and push the PostgreSQL 19 (BETA, tech preview) image set from
        percona-docker postgresql-containers/community: postgres19-community,
        ppg19-postgres, pgbackrest19 (2.59), pgbouncer19.
        Delete once ppg-19 is released and 19 joins pg-containers-docker-build.
        Do not edit this job through the web!
    concurrent: false
    properties:
    - build-discarder:
        days-to-keep: -1
        num-to-keep: 10
        artifact-days-to-keep: -1
        artifact-num-to-keep: 10
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines.git
            branches:
            - master
            wipe-workspace: false
      lightweight-checkout: true
      script-path: cloud/jenkins/pg19_community_docker_build.groovy
    parameters:
    - string:
        name: GIT_PD_BRANCH
        default: main
        description: Tag/Branch for percona/percona-docker repository
    - string:
        name: GIT_PD_REPO
        default: https://github.com/percona/percona-docker
        description: percona/percona-docker repository
    - string:
        name: PGBACKREST_BASE_IMAGE
        default: perconalab/percona-postgresql-operator:main-pgbackrest-community
        description: Existing community pgbackrest image used as the base for the pgbackrest19 (2.59) overlay
