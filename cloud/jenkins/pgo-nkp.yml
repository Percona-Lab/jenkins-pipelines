- job:
    name: pgo-nkp
    project-type: pipeline
    description: |
        PG Operator E2E tests on two existing, dedicated NKP clusters.
        Do not edit this job through the web!
    concurrent: false
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines.git
            branches:
            - master
            wipe-workspace: false
      lightweight-checkout: true
      script-path: cloud/jenkins/pgo_nkp.groovy